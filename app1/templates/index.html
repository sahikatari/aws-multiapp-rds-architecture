<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .container{
            width:100%;
            max-width:1100px;
            display:grid;
            grid-template-columns: 1fr 1.2fr;
            gap:30px;
        }

        .card{
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:20px;
            padding:35px;
            color:white;
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
        }

        .title{
            font-size:32px;
            font-weight:700;
            margin-bottom:10px;
        }

        .subtitle{
            color:#e0e0e0;
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        .input-box input{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,0.2);
            color:white;
            font-size:15px;
        }

        .input-box input::placeholder{
            color:#ddd;
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:white;
            color:#5a67d8;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            transform:translateY(-2px);
            background:#f3f3f3;
        }

        .table-title{
            font-size:26px;
            margin-bottom:20px;
            font-weight:600;
        }

        table{
            width:100%;
            border-collapse:collapse;
            overflow:hidden;
            border-radius:15px;
        }

        th{
            background:rgba(255,255,255,0.2);
            padding:15px;
            text-align:left;
            font-size:15px;
        }

        td{
            padding:14px;
            border-bottom:1px solid rgba(255,255,255,0.1);
            color:#f5f5f5;
        }

        tr:hover{
            background:rgba(255,255,255,0.08);
        }

        .empty{
            text-align:center;
            padding:20px;
            color:#ddd;
        }

        @media(max-width:900px){

            .container{
                grid-template-columns:1fr;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <!-- Registration Form -->
    <div class="card">

        <h1 class="title">Student Portal</h1>
        <p class="subtitle">Register students directly into AWS RDS Database</p>

        <form method="POST">

            <div class="input-box">
                <label>Student Name</label>
                <input type="text" name="name" placeholder="Enter full name" required>
            </div>

            <div class="input-box">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter email address" required>
            </div>

            <button type="submit" class="btn">
                Register Student
            </button>

        </form>

    </div>

    <!-- Student Table -->
    <div class="card">

        <h2 class="table-title">Registered Students</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>

            {% if students %}

                {% for student in students %}

                <tr>
                    <td>{{ student[0] }}</td>
                    <td>{{ student[1] }}</td>
                    <td>{{ student[2] }}</td>
                </tr>

                {% endfor %}

            {% else %}

                <tr>
                    <td colspan="3" class="empty">
                        No students registered yet
                    </td>
                </tr>

            {% endif %}

        </table>

    </div>

</div>

</body>
</html>
